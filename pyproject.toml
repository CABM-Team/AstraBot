[project]
name = "AstraBot"
version = "0.1.0"
description = "AstraBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.28.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "mcp[cli]>=1.0.0",
    "orjson>=3.0.0",
]

[tool.nonebot]
plugin_dirs = ["astrabot"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]

